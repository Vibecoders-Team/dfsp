name: dfsp-backend-dev

# Shared variables from env files:
# - .env.dev: defaults for the command
# - .env.local: developer overrides (if present, takes priority)
x-env-files: &env_files
  env_file:
    - path: ../../deploy/.env.dev
      required: false
    - path: ../../deploy/.env.local
      required: false

networks:
  dfsp:
    driver: bridge

volumes:
  pgdata:
  redis_data:

services:
  # ----------- optional local DB (enabled via localdb profile) ----------
  db:
    image: postgres:16-alpine
    container_name: dfsp-db
    <<: *env_files
    # IMPORTANT: read POSTGRES_* values from DB_* provided via env_file.
    # Do this BEFORE the default postgres entrypoint starts.
    entrypoint:
      - /bin/sh
      - -c
      - |
        export POSTGRES_USER="${DB_USER:-dfsp}";
        export POSTGRES_PASSWORD="${DB_PASSWORD:-dfsp}";
        export POSTGRES_DB="${DB_NAME:-dfsp}";
        exec /usr/local/bin/docker-entrypoint.sh postgres
    # Compose needs the ports up front; keep as-is
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      # Escape $ -> $$ so variables are expanded INSIDE the container
      test:
        [ "CMD-SHELL",
          "pg_isready -U $${DB_USER:-dfsp} -d $${DB_NAME:-dfsp} -p 5432" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [ dfsp ]
    profiles: [ "localdb" ]

  # ------------------------ Redis (enabled by default) ------------------------
  redis:
    image: redis:7.2-alpine
    container_name: dfsp-redis
    <<: *env_files
    # redis image does not need env; it listens on 6379.
    # External port is set by Compose.
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    networks: [ dfsp ]

  # ------------------------ Migrations (run-once, optional) --------------------
  migrator:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dfsp-migrator
    working_dir: /app
    <<: *env_files
    command:
      - bash
      - -lc
      - |
        export POSTGRES_DSN="postgresql+psycopg://$${DB_USER:-dfsp}:$${DB_PASSWORD:-dfsp}@$${DB_HOST:-dfsp-db}:$${DB_PORT:-5432}/$${DB_NAME:-dfsp}";
        export REDIS_URL="$${REDIS_URL:-redis://$${REDIS_HOST:-dfsp-redis}:$${REDIS_PORT:-6379}/$${REDIS_DB:-0}}";
        export WAIT_FOR_TIMEOUT="$${WAIT_FOR_TIMEOUT:-60}";
        ./docker/entrypoint.sh migrate
    environment:
      # DEV: auto-generate revisions before upgrade
      ALEMBIC_AUTO_REVISION: "${ALEMBIC_AUTO_REVISION:-true}"
    volumes:
      - ../app:/app/app
      - ../migrations:/app/migrations
      - ../alembic.ini:/app/alembic.ini
    depends_on:
      redis:
        condition: service_healthy
      # db:
      #   condition: service_healthy
    restart: "no"
    networks: [ dfsp ]
    profiles: [ "migrate" ]

  # ----------------------------- API (uvicorn --reload) -------------------------
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dfsp-api
    environment:
      API_AUTO_MIGRATE: "${API_AUTO_MIGRATE:-true}"   # dev convenience
      ALEMBIC_AUTO_REVISION: "${ALEMBIC_AUTO_REVISION:-true}"
    working_dir: /app
    <<: *env_files
    command:
      - bash
      - -lc
      - |
        export POSTGRES_DSN="postgresql+psycopg://$${DB_USER:-dfsp}:$${DB_PASSWORD:-dfsp}@$${DB_HOST:-dfsp-db}:$${DB_PORT:-5432}/$${DB_NAME:-dfsp}";
        export REDIS_URL="$${REDIS_URL:-redis://$${REDIS_HOST:-dfsp-redis}:$${REDIS_PORT:-6379}/$${REDIS_DB:-0}}";
        export API_HOST="$${API_HOST:-0.0.0.0}";
        export API_PORT="$${API_PORT:-8000}";
        export API_RELOAD="$${API_RELOAD:-true}";
        export API_LOG_LEVEL="$${API_LOG_LEVEL:-info}";
        export API_AUTO_MIGRATE="$${API_AUTO_MIGRATE:-false}";
        export WAIT_FOR_TIMEOUT="$${WAIT_FOR_TIMEOUT:-60}";
        export JWT_SECRET="$${JWT_SECRET:-change_me}";
        ./docker/entrypoint.sh api
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ../app:/app/app
      - ../migrations:/app/migrations
      - ../alembic.ini:/app/alembic.ini
      - ../tests:/app/tests
    depends_on:
      redis:
        condition: service_healthy
      #db:
      #  condition: service_healthy
      #migrator:
      #  condition: service_completed_successfully
    restart: unless-stopped
    networks: [ dfsp ]

  # ----------------------------- Celery Worker (relayer) -------------------------
  celery-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dfsp-celery-worker
    working_dir: /app
    <<: *env_files
    command:
      - bash
      - -lc
      - |
        export POSTGRES_DSN="postgresql+psycopg://$${DB_USER:-dfsp}:$${DB_PASSWORD:-dfsp}@$${DB_HOST:-dfsp-db}:$${DB_PORT:-5432}/$${DB_NAME:-dfsp}";
        export REDIS_URL="$${REDIS_URL:-redis://$${REDIS_HOST:-dfsp-redis}:$${REDIS_PORT:-6379}/$${REDIS_DB:-0}}";
        export WAIT_FOR_TIMEOUT="$${WAIT_FOR_TIMEOUT:-60}";
        echo "Starting Celery worker...";
        echo "Waiting for Redis at $${REDIS_URL}...";
        uv run python -c "
        import redis, time, sys, os, logging
        logging.basicConfig(level=logging.INFO)
        log = logging.getLogger('wait-for-redis')
        url = os.getenv('REDIS_URL', 'redis://dfsp-redis:6379/0')
        timeout = int(os.getenv('WAIT_FOR_TIMEOUT', '60'))
        deadline = time.time() + timeout
        while time.time() < deadline:
            try:
                r = redis.Redis.from_url(url, socket_connect_timeout=5)
                if r.ping():
                    log.info('[wait] Redis OK')
                    sys.exit(0)
            except Exception as e:
                log.warning(f'[wait] Redis not ready: {e}')
                time.sleep(2)
        log.error('[wait] Redis timeout')
        sys.exit(1)
        ";
        echo "Redis OK, starting worker...";
        uv run celery -A app.relayer:celery worker --loglevel=info --concurrency=2 -Q relayer.high,relayer.default
    volumes:
      - ../app:/app/app
      - ../migrations:/app/migrations
      - ../alembic.ini:/app/alembic.ini
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [ dfsp ]
