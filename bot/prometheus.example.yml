# Example Prometheus configuration for monitoring the Telegram bot
# Copy this file to where Prometheus is running (usually /etc/prometheus/prometheus.yml)
# or specify the path to it when starting Prometheus with the --config.file flag

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Configuration for the Telegram bot
  - job_name: 'telegram-bot'
    static_configs:
      - targets: ['localhost:8001']  # PROM_PORT from the bot settings
        labels:
          service: 'telegram-bot'
          environment: 'production'

  # If you have multiple bot instances (for example in Docker Swarm or Kubernetes)
  # you can use service discovery instead:
  # - job_name: 'telegram-bot'
  #   kubernetes_sd_configs:
  #     - role: pod
  #       namespaces:
  #         names:
  #           - default
  #   relabel_configs:
  #     - source_labels: [__meta_kubernetes_pod_label_app]
  #       regex: telegram-bot
  #       action: keep

